<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع ملف المواد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="upload-courses-file.css">
</head>

<body>

    <nav id="topNav">
        <div id="navBrand">
            <div id="navIcon"><i class="bi bi-calendar2-week"></i></div>
            <span>لوحة تحكم الجداول</span>
        </div>
        <div id="navActions">
            <a href="/change-password" role="button" class="btn btn-nav-secondary" target="_blank">
                <i class="bi bi-key-fill"></i> تغيير كلمة السر
            </a>
            <button id="logOutBtn" type="button" class="btn btn-nav-danger">
                <i class="bi bi-box-arrow-right"></i> تسجيل الخروج
            </button>
        </div>
    </nav>

    <div id="pageWrapper">

        <div id="header">
            <div id="noteCard">
                <i class="bi bi-info-circle-fill"></i>
                <span>
                    عند كتابة اسم الملف، يفضل كتابته على هذا النحو:
                    القسم-الدفعات-التاريخ-الوقت &nbsp;
                    <strong>CS-1-2-3-4--30-1-2022--11-15AM</strong>
                </span>
            </div>
        </div>

        <div id="dWrapperSection">

            <!-- Add file card -->
            <div class="panel-card" id="addPanel">
                <div class="panel-card-header" id="addCoursesFileDiv">
                    <div class="panel-card-title">
                        <i class="bi bi-plus-circle-fill"></i>
                        إضافة ملف مواد
                    </div>
                    <button id="collapseBtn" class="collapse-toggle" type="button"
                        data-bs-toggle="collapse" data-bs-target="#collapseCoursesFileDiv"
                        aria-expanded="true" aria-controls="collapseCoursesFileDiv">
                        <i class="bi bi-chevron-up" id="collapseIcon"></i>
                    </button>
                </div>

                <div id="collapseCoursesFileDiv" class="accordion-collapse collapse show"
                    aria-labelledby="addCoursesFileDiv">
                    <div class="panel-card-body">

                        <div id="addSingle">
                            <div class="field-group">
                                <label for="cInputName" class="field-label">الاسم</label>
                                <input type="text" class="form-control" id="cInputName" value="CS-">
                            </div>
                            <div class="field-group">
                                <label for="cInputDes" class="field-label">الوصف</label>
                                <input type="text" class="form-control" id="cInputDes" placeholder="اختياري">
                            </div>
                            <div class="field-row">
                                <div class="field-group field-half">
                                    <label for="dep" class="field-label">القسم</label>
                                    <input class="form-control" list="depOptions" id="dep" placeholder="ابحث عن القسم">
                                    <datalist id="depOptions">
                                        <option value="علوم حاسب">
                                        <option value="علوم حاسب لائحة جديدة">
                                        <option value="هندسة">
                                    </datalist>
                                </div>
                                <div class="field-group field-half">
                                    <label for="term" class="field-label">الفصل الدراسي</label>
                                    <input class="form-control" list="termtOptions" id="term" placeholder="ابحث عن الترم">
                                    <datalist id="termtOptions">
                                        <option value="سبتمبر-يناير">
                                        <option value="يناير-مايو">
                                        <option value="مايو-أغسطس">
                                    </datalist>
                                </div>
                            </div>
                        </div>

                        <div id="addBulk">
                            <label class="field-label">ملف المواد (CSV)</label>
                            <div class="input-group" id="csvInputGroup">
                                <input type="file" accept=".csv" class="form-control" id="csvCoursesFileInput"
                                    aria-describedby="addCoursesFileBtn" aria-label="Upload">
                                <button class="btn btn-upload" type="button" id="addCoursesFileBtn">
                                    <i class="bi bi-cloud-arrow-up-fill"></i> رفع الملف
                                </button>
                            </div>
                        </div>

                        <div id="addingD-alerts"></div>

                    </div>
                </div>
            </div>

            <!-- Current files card -->
            <div class="panel-card" id="fetchingSection">
                <div class="panel-card-header">
                    <div class="panel-card-title">
                        <i class="bi bi-folder2-open"></i>
                        ملفات المواد الحالية
                    </div>
                </div>
                <div class="panel-card-body">

                    <div id="selectDiv">
                        <button class="btn btn-loading" type="button" disabled>
                            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                            جاري سحب الملفات...
                        </button>
                    </div>

                    <div id="dataPicker">
                        <button id="deleteCoursesFileBtn" type="button" class="btn btn-del" disabled>
                            <i class="bi bi-file-x-fill"></i> حذف الملف المحدد
                        </button>
                        <button id="deleteAllFilesBtn" type="button" class="btn btn-del-all" disabled>
                            <i class="bi bi-trash3-fill"></i> حذف كل الملفات
                        </button>
                    </div>

                    <div id="fetchingTxs-alerts"></div>

                </div>
            </div>

        </div>

        <div id="addingDAlerts"></div>

        <div id="requestLogs"></div>

        <div id="coursesFileInfo"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLkBQppoJ8NDx/" crossorigin="anonymous">
    </script>
    <script src="upload-courses-file.js"></script>
</body>

</html>
