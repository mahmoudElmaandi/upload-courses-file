<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغيير كلمة السر</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="change-password.css">
</head>

<body>

    <div id="changePasswordCard">

        <div id="cardIcon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <h1>تغيير كلمة السر</h1>
        <p class="subtitle">أدخل كلمة السر الحالية ثم كلمة السر الجديدة</p>

        <form class="form" role="form" action="/change-password" method="POST" autocomplete="off">

            <div class="field-group">
                <label for="inputPasswordOld" class="field-label">كلمة السر الحالية</label>
                <div class="input-group pw-group">
                    <input type="password" class="form-control" id="inputPasswordOld" required name="currentPassword" placeholder="••••••••">
                    <button class="btn btn-eye" type="button" onclick="togglePassword('inputPasswordOld', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="field-group">
                <label for="inputPasswordNew" class="field-label">كلمة السر الجديدة</label>
                <div class="input-group pw-group">
                    <input type="password" class="form-control" id="inputPasswordNew" required name="newPassword" placeholder="••••••••">
                    <button class="btn btn-eye" type="button" onclick="togglePassword('inputPasswordNew', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="field-group">
                <label for="inputPasswordNewVerify" class="field-label">تأكيد كلمة السر الجديدة</label>
                <div class="input-group pw-group">
                    <input type="password" class="form-control" id="inputPasswordNewVerify" required name="confirmPassword" placeholder="••••••••">
                    <button class="btn btn-eye" type="button" onclick="togglePassword('inputPasswordNewVerify', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="button" id="changePasswordBtn" class="btn btn-submit">
                <i class="bi bi-check2-circle"></i> تغيير كلمة السر
            </button>

        </form>

        <div id="alerts"></div>

        <a href="/upload-courses-file.html" class="back-link">
            <i class="bi bi-arrow-right"></i> العودة للوحة التحكم
        </a>

    </div>

    <script src="change-password.js"></script>
</body>

</html>
